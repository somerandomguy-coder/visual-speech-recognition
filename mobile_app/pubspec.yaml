name: silent_vsr_mobile
description: "100% Offline Real-Time Visual Speech Recognition (Silent Lip-Reading) Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  google_mlkit_face_mesh_detection: ^0.2.0
  onnxruntime_flutter: ^0.1.0
  llama_cpp_dart: ^0.1.0
  image: ^4.2.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.9

flutter:
  uses-material-design: true
  assets:
    - assets/tokens/unigram5000_units.txt
    - assets/models/auto_avsr_visual_int8.onnx
    - assets/models/qwen2.5-0.5b-instruct-q4_k_m.gguf
