[project]
name = "visual-speech-recognition"
version = "0.1.0"
description = "In-the-wild Visual Speech Recognition testbed and mobile pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.2.0",
    "opencv-python-headless>=4.9.0",
    "mediapipe==0.10.14",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "ollama>=0.1.7",
    "pydantic>=2.6.0",
    "scipy>=1.12.0",
    "av>=11.0.0",
    "sentencepiece>=0.2.0",
    "hydra-core>=1.3.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121" },
]
torchvision = [
  { index = "pytorch-cu121" },
]
torchaudio = [
  { index = "pytorch-cu121" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
